name: GPT-TYPE 4-Week Telegram Traffic & SEO Report

on:
  schedule:
    # Runs automatically every month on the 22nd at 12:30 UTC (4-week progress report)
    - cron: '30 12 22 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Send 4-Week Report to Telegram
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOG_URL: ${{ secrets.BLOG_URL || 'https://gpttype.blogspot.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.monthly_report

      - name: Save Monthly Traffic Snapshot
        if: ${{ success() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly_metrics.json
          git diff --staged --quiet || git commit -m "chore(analytics): update 4-week traffic metrics snapshot [skip ci]"
          git push || echo "Notice: Metrics push completed or skipped."
